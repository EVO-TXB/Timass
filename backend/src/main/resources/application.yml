server:
  port: 8080

spring:
  application:
    name: timass-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://localhost:3307/timass_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:nhotrinh1982}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

gemini:
  api-key: ${GEMINI_API_KEY:AQ.Ab8RN6LMlV0FRMQqyfwajHAPnPQbTaFh7LgGp_e4GpLRh7ixvQ}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta/models

logging:
  level:
    com.timass: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
